name: React CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOCKER_USER: bhanu4309

    steps:

      # -------------------------------
      # Checkout Code
      # -------------------------------
      - name: Checkout Code
        uses: actions/checkout@v3

      # -------------------------------
      # SonarQube Analysis
      # -------------------------------
      - name: Run SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_AUTH_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=hotel-management
            -Dsonar.sources=src

      # -------------------------------
      # Build React App
      # -------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build React App
        run: npm run build

      - name: Install bestzip
        run: npm install --save-dev bestzip

      - name: Zip Build Folder
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          mkdir artifacts
          ./node_modules/.bin/bestzip artifacts/myweb-$BUILD_NUMBER.zip build/*

      # -------------------------------
      # Upload to Nexus
      # -------------------------------
      - name: Upload Build Artifact to Nexus
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          curl -u ${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }} \
            --upload-file artifacts/myweb-$BUILD_NUMBER.zip \
            http://3.236.243.28:8081/repository/npm-releases/myweb-$BUILD_NUMBER.zip

      # -------------------------------
      # Login to DockerHub (using PASSWORD secret)
      # -------------------------------
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}   # <= Using password secret

      # -------------------------------
      # Build Docker Image
      # -------------------------------
      - name: Build Docker Image
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          docker build -t $DOCKER_USER/myreactapp:$BUILD_NUMBER .
          docker tag $DOCKER_USER/myreactapp:$BUILD_NUMBER $DOCKER_USER/myreactapp:latest

      # -------------------------------
      # Push Docker Image
      # -------------------------------
      - name: Push Docker Image to DockerHub
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          docker push $DOCKER_USER/myreactapp:$BUILD_NUMBER
          docker push $DOCKER_USER/myreactapp:latest

      # -------------------------------
      # Run Container (only on self-hosted runner)
      # -------------------------------
      - name: Run Container
        if: runner.name == 'self-hosted'
        run: |
          docker rm -f react-app || true
          docker run -d --name react-app -p 80:80 $DOCKER_USER/myreactapp:latest

      - name: Finished
        run: echo "Pipeline completed successfully!"
